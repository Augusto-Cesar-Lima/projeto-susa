<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SUSA-BH | Cadastro</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <div class="container">

    <div class="card">

      <h1 class="logo">SUSA-BH</h1>
      <p class="subtitulo">Crie sua conta</p>

      <form id="form-cadastro">

        <div class="campo">
          <label for="nome">Nome completo</label>
          <input type="text" id="nome" placeholder="Dr. João Silva" >
        </div>

        <div class="campo">
          <label for="crm">CRM</label>
          <input type="text" id="crm" placeholder="CRM/MG 123456" >
        </div>

        <div class="campo">
          <label for="email-cad">E-mail</label>
          <input type="email" id="email-cad" placeholder="seu@email.com" >
        </div>

        <div class="campo">
          <label for="senha-cad">Senha</label>
          <input type="password" id="senha-cad" placeholder="Mínimo 6 caracteres" >
        </div>

        <div class="campo">
          <label for="confirma-senha">Confirmar senha</label>
          <input type="password" id="confirma-senha" placeholder="Repita a senha" >
        </div>

        <p id="erro-cadastro" class="mensagem-erro"></p>
        <p id="sucesso-cadastro" class="mensagem-sucesso"></p>

        <button type="submit" class="btn-primario">Cadastrar</button>

      </form>

      <a href="index.html" class="link">Já tem conta? Faça login</a>

    </div>

  </div>

  <script src="assets/js/auth.js"></script>
</body>
</html>
